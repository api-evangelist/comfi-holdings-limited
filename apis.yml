aid: comfi-holdings-limited
name: Comfi Holdings Limited
description: 'Comfi (Comfi Holdings Limited) is a UAE-based financial technology company providing
  B2B working capital solutions for small and medium enterprises and trading businesses. Its three
  core products are invoice discounting (turning outstanding invoices into immediate cash), Buy Now
  Pay Later (BNPL) for flexible B2B credit terms, and automotive dealer inventory financing. Comfi
  positions itself around speed — "capital in hours, not weeks" — and reports 1,000+ SMEs served,
  15,000+ invoices financed, and $100M+ capital deployed across the UAE market. Eligibility requires
  a UAE-registered B2B business with at least six months of operating history and AED 100,000+ monthly
  revenue. Backed by 500 Global. No public API, OpenAPI, SDK, or developer portal was found at the
  time of this profile.'
